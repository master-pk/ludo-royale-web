<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo Royale - Join Room</title>
<style>
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
         background:linear-gradient(180deg,#C3E7F8 0%,#F7DEE2 100%);
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:rgba(255,255,255,.92); border-radius:28px; padding:38px 30px;
          max-width:340px; width:88%; text-align:center;
          box-shadow:0 14px 44px rgba(47,54,64,.18); }
  h1 { color:#2F3640; font-size:26px; margin:0 0 4px; }
  .crown { font-size:44px; }
  .code-label { color:#6b7280; font-size:13px; letter-spacing:.12em; margin-top:20px; }
  .code { font-size:38px; font-weight:800; letter-spacing:.24em; color:#2F3640; margin:4px 0 22px; }
  .btn { display:block; width:100%; padding:16px 0; border:0; border-radius:16px;
         background:#2E7D32; color:#fff; font-size:18px; font-weight:700; cursor:pointer;
         box-shadow:0 4px 0 #1B5E20; }
  .btn:active { transform:translateY(2px); box-shadow:0 2px 0 #1B5E20; }
  .copied { color:#2E7D32; font-size:13px; height:18px; margin-top:8px; }
  .fallback { display:none; margin-top:26px; border-top:1px solid #e5e7eb; padding-top:20px; }
  .fallback p { color:#6b7280; font-size:14px; margin:0 0 12px; }
  .badge { display:inline-flex; align-items:center; gap:10px; background:#111; color:#fff;
           border-radius:12px; padding:10px 18px; opacity:.55; }
  .badge .tri { width:0; height:0; border-top:11px solid transparent; border-bottom:11px solid transparent;
                border-left:18px solid #34d399; }
  .badge div { text-align:left; line-height:1.15; }
  .badge small { font-size:10px; color:#bbb; display:block; }
  .badge b { font-size:15px; }
  .soon { color:#9ca3af; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="crown">&#128081;</div>
  <h1>Ludo Royale</h1>
  <div class="code-label">ROOM CODE</div>
  <div class="code" id="code">------</div>
  <button class="btn" id="go">OPEN GAME &amp; JOIN</button>
  <div class="copied" id="copied"></div>
  <div class="fallback" id="fb">
    <p>Don't have Ludo Royale yet?</p>
    <span class="badge">
      <span class="tri"></span>
      <div><small>GET IT ON</small><b>Google Play</b></div>
    </span>
    <div class="soon">Coming soon</div>
  </div>
</div>
<script>
  var code = (new URLSearchParams(location.search).get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  document.getElementById('code').textContent = code || '------';
  var opened = false;
  document.addEventListener('visibilitychange', function(){ if (document.hidden) opened = true; });
  // Chrome blocks raw custom-scheme JS navigation; the Android intent:// form
  // is the sanctioned path (scheme + package + explicit browser fallback).
  if (new URLSearchParams(location.search).get('fb') === '1') {
    document.getElementById('fb').style.display = 'block';
  }
  document.getElementById('go').addEventListener('click', function(){
    if (!code) return;
    var token = 'LR-JOIN:' + code;
    var done = function(){
      document.getElementById('copied').textContent = 'Code copied - opening the game...';
      var isAndroid = /android/i.test(navigator.userAgent);
      if (isAndroid) {
        var fallback = location.origin + location.pathname + '?join=' + code + '&fb=1';
        location.href = 'intent://join/' + code +
          '#Intent;scheme=ludoroyale;package=com.factory.ludoroyale;' +
          'S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
      } else {
        location.href = 'ludoroyale://join/' + code;
        setTimeout(function(){
          if (!opened && !document.hidden) document.getElementById('fb').style.display = 'block';
        }, 1800);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(token).then(done, done);
    } else { done(); }
  });
</script>
</body>
</html>
